<!DOCTYPE html>
<html>
<head>
    <title>Button Calculator</title>

    <style>
        body {
            background-color: rgb(171, 255, 168);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .calc {
            background: rgb(251, 255, 131);
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            height: 500px;
            box-shadow: 0 0 40px gray;
        }

        input {
            width: 100%;
            height: 40px;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: right;
        }

        button {
            width: 48px;
            height: 40px;
            font-size: 16px;
            margin: 3px;
            cursor: pointer;
            background-color: rgb(221, 165, 255);
        }
    </style>
</head>

<body>

<div class="calc">
    <input type="text" id="display" disabled>

    <div>
        <button onclick="clr()">C</button>
        <button onclick="append('%')">%</button>
        <button onclick="append('**')">^</button>
        <button onclick="append('/')">/</button>
    </div>

    <div>
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('*')">x</button>
    </div>

    <div>
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('-')">_</button>
    </div>

    <div>
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('+')">+</button>
    </div>

    <div>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="calculate()" style="width: 104px;">=</button>
    </div>
</div>

<script>
    function append(value) {
        document.getElementById("display").value += value;
    }

    function clr() {
        document.getElementById("display").value = "";
    }

    function calculate() {
        let exp = document.getElementById("display").value;
        document.getElementById("display").value = eval(exp);
    }
</script>

</body>
</html>
