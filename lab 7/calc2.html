<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Modern Gradient Background */
            background: linear-gradient(135deg, #1e1e2f, #323250);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calc {
            background-color: #22252d;
            padding: 25px;
            border-radius: 20px;
            width: 320px;
            /* Soft shadow for depth */
            box-shadow: 15px 15px 30px #15171c, 
                       -15px -15px 30px #2f333e;
        }

        #display {
            width: 100%;
            height: 70px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            margin-bottom: 20px;
            padding-right: 10px;
            /* Remove blue outline on click */
            outline: none; 
        }

        /* Using CSS Grid for perfect alignment */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            background-color: #2a2d36;
            color: #fff;
            box-shadow: 5px 5px 10px #1a1c22, 
                       -5px -5px 10px #3a3e4a;
            transition: all 0.2s ease;
        }

        /* Button Hover Effects */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 7px 7px 12px #1a1c22, 
                       -7px -7px 12px #3a3e4a;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: inset 5px 5px 10px #1a1c22, 
                        inset -5px -5px 10px #3a3e4a;
        }

        /* Specific Styling for different button types */
        .operator {
            color: #26de81; /* Green/Cyan */
        }

        .action {
            color: #fc5c65; /* Red/Pink */
        }

        .equals {
            grid-column: span 2; /* Spans 2 columns */
            background-color: #26de81;
            color: #22252d;
            font-weight: bold;
        }
        
        /* Make equals button glow slightly */
        .equals:hover {
            background-color: #20bf6b;
            box-shadow: 0 0 15px rgba(38, 222, 129, 0.4);
        }

    </style>
</head>
<body>

<div class="calc">
    <input type="text" id="display" placeholder="0" disabled>
    
    <div class="buttons">
        <button class="action" onclick="clr()">AC</button>
        <button class="operator" onclick="del()">DEL</button>
        <button class="operator" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>
        
        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>
        
        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>
        
        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>
        
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");

    function append(value) {
        // If display shows Error, clear it first
        if(display.value === 'Error') display.value = '';
        display.value += value;
    }

    function clr() {
        display.value = "";
    }

    function del() {
        // Remove the last character
        display.value = display.value.toString().slice(0, -1);
    }

    function calculate() {
        try {
            // Check if empty
            if(display.value === "") return;
            
            // Eval is risky in production, but okay for this toy project.
            // We catch syntax errors here.
            let result = eval(display.value);
            
            // Handle floating point errors (e.g. 0.1 + 0.2) slightly better
            if (!Number.isInteger(result)) {
                result = result.toFixed(4).replace(/\.?0+$/, "");
            }
            
            display.value = result;
        } catch (error) {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
