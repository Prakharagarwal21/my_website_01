<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute BMI Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Body Styling */
        body {
            font-family: 'Quicksand', sans-serif; /* Soft, rounded font */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* Subtle background */
            background-image: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); /* Pastel Blue Gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The Main Card */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 30px; /* Very rounded corners */
            box-shadow: 0 10px 25px rgba(118, 168, 246, 0.3); /* Soft blue shadow */
            text-align: center;
            width: 320px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px); /* Little float effect */
        }

        h1 {
            color: #5d5fef;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eef1f5;
            border-radius: 15px; /* Pill shape inputs */
            box-sizing: border-box; /* Fixes padding issues */
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            color: #555;
        }

        input:focus {
            border-color: #a1c4fd;
            background-color: #f9fbff;
        }

        /* The Button */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%); /* Vivid gradient */
            border: none;
            border-radius: 50px; /* Fully rounded button */
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05); /* Grow slightly on hover */
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.6);
        }

        button:active {
            transform: scale(0.95); /* Click effect */
        }

        /* Result Box */
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            display: none; /* Hidden by default */
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Animation for result */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>✨ BMI Calculator ✨</h1>
        <form>
            <div class="input-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 60" required>
            </div>
            <div class="input-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 170" required>
            </div>
            <button type="button" onclick="calculateBMI()">Calculate! </button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        function calculateBMI() {
            var weight = parseFloat(document.getElementById("weight").value);
            var height = parseFloat(document.getElementById("height").value);
            var resultBox = document.getElementById("result");

            if (weight > 0 && height > 0) {
                var bmi = (weight / ((height / 100) * (height / 100))).toFixed(2);
                
                let message = "";
                let color = "";
                let bg = "";

                // Determine category and style
                if (bmi < 18.5) {
                    message = "Underweight ☁️";
                    color = "#e67e22";
                    bg = "#fdf2e9";
                } else if (bmi >= 18.5 && bmi < 24.9) {
                    message = "Healthy Weight 🎉";
                    color = "#27ae60";
                    bg = "#eafaf1";
                } else if (bmi >= 25 && bmi < 29.9) {
                    message = "Overweight 🍪 you motu 🤰  ";
                    color = "#d35400";
                    bg = "#fbf0eb";
                } else {
                    message = "Obese 🧸";
                    color = "#c0392b";
                    bg = "#fadbd8";
                }
                if (height< 165) {
                    message = "height";
                    color = "#e67e22";
                    bg = "#fdf2e9";
 }

                resultBox.style.display = "block";
                resultBox.style.color = color;
                resultBox.style.backgroundColor = bg;
                resultBox.innerHTML = `Your BMI is <strong>${bmi}</strong><br><small>${message}</small>`;
                
            } else {
                resultBox.style.display = "block";
                resultBox.style.color = "#7f8c8d";
                resultBox.style.backgroundColor = "#f0f3f4";
                resultBox.innerText = "Please enter valid numbers!";
            }
        }
    
    </script>
</body>
</html>
